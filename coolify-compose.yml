version: "3"

services:
  backend:
    build: 
      context: .
      target: backend
    restart: on-failure
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
      - REDIS_SOCKETIO=redis-socketio:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  frontend:
    build:
      context: .
      target: backend
    command: >
      bash -c "bench serve --port 8080"
    restart: on-failure
    environment:
      - DB_HOST=db
    ports:
      - "8080:8080"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  schedule:
    build:
      context: .
      target: backend
    command: bench schedule
    restart: on-failure
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  worker-default:
    build:
      context: .
      target: backend
    command: bench worker --queue default
    restart: on-failure
    environment:
      - DB_HOST=db
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  db:
    image: mariadb:10.6
    restart: on-failure
    environment:
      - MYSQL_ROOT_PASSWORD=admin
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:alpine
    restart: on-failure
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:alpine
    restart: on-failure
    volumes:
      - redis-queue-data:/data

  redis-socketio:
    image: redis:alpine
    restart: on-failure
    volumes:
      - redis-socketio-data:/data

  configurator:
    build:
      context: .
      target: backend
    command:
      - bash
      - -c
      - |
        bench set-config -g db_host $$DB_HOST && \
        bench set-config -g redis_cache "redis://$$REDIS_CACHE" && \
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE" && \
        bench set-config -g redis_socketio "redis://$$REDIS_SOCKETIO" && \
        bench set-config -p db_port $$DB_PORT && \
        bench new-site miraiyug.local --force \
          --mariadb-root-password admin \
          --admin-password admin \
          --install-app hrms && \
        bench use miraiyug.local
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
      - REDIS_SOCKETIO=redis-socketio:6379
    restart: "no"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

volumes:
  sites:
  logs:
  db-data:
  redis-cache-data:
  redis-queue-data:
  redis-socketio-data:
