version: "3.8"

services:
  # ─── Database ──────────────────────────────────────────────────────────────
  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql

  # ─── Redis (Cache, Queue, SocketIO) ─────────────────────────────────────────
  redis-cache:
    image: redis:6.2-alpine
  redis-queue:
    image: redis:6.2-alpine
  redis-socketio:
    image: redis:6.2-alpine

  # ─── Backend (Python/Gunicorn) ─────────────────────────────────────────────
  backend:
    image: frappe/erpnext:version-15
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      REDIS_SOCKETIO: redis-socketio:6379
      FRAPPE_SITE_NAME_HEADER: miraiyug.local
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  # ─── Frontend (Nginx) ──────────────────────────────────────────────────────
  # NOTE: Using the unified image with the nginx-entrypoint.sh command
  frontend:
    image: frappe/erpnext:version-15
    command: nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: miraiyug.local
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: "50m"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    expose:
      - "8080"
    depends_on:
      - backend

  # ─── Realtime Events (Websocket) ───────────────────────────────────────────
  websocket:
    image: frappe/erpnext:version-15
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      DB_HOST: db
      REDIS_SOCKETIO: redis-socketio:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  # ─── Background Workers & Scheduler ───────────────────────────────────────
  queue-short:
    image: frappe/erpnext:version-15
    command: bench worker --queue short
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  scheduler:
    image: frappe/erpnext:version-15
    command: bench schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  # ─── INITIAL SITE CREATOR (Runs once) ──────────────────────────────────────
  create-site:
    image: frappe/erpnext:version-15
    command:
      - /bin/bash
      - -c
      - |
        wait-for-it db:3306 -t 120
        bench new-site miraiyug.local --force --admin-password admin --db-root-password admin --install-app erpnext --set-default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - db

volumes:
  db-data:
  sites:
